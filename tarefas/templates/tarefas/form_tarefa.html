<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulário de Tarefas</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        width: 100%;
        height: 100vh;
        background-image: linear-gradient(45deg, #1f1f1f, #0f110c);
        font-family: Arial, Helvetica, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      .wrap {
           width: 90%;
        max-width: 900px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      label {
        color: #1f1f1f;
        margin-bottom: 5px;
        font-size: 1rem;
      }

      form {
        background-color: #fbffff;
        width: 90%;
        max-width: 500px;
        padding: 20px;
        border-radius: 8px;
        display: flex;
        flex-direction: column;
      }

      input[type="text"],
      input[type="date"],
      textarea,
      select {
        margin-bottom: 15px;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 1rem;
      }

      button {
        padding: 10px;
        background-color: #259c00;
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 1rem;
        cursor: pointer;
        font-weight: bold;
      }
      button:hover {
        background-color: #1f7a00;
      }

      .cancel-button {
        background-color: #dcdcdc;
        color: #1f1f1f;
        margin-top: 10px;
      }
      .cancel-button:hover {
        background-color: #bcbcbc;
      }

      @media (max-width: 600px) {
        form {
          width: 95%;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <form method="post">
        {% csrf_token %}
        <!--Título da tarefa-->
        <label for="nome">Nome da tarefa</label>
        <input
          type="text"
          name="nome"
          placeholder="Ex: Estudar"
          value="{{ tarefa.nome|default:'' }}"
          required
        />
        <!--Descrição-->
        <label for="descricao">Descrição</label>
        <textarea name="descricao" placeholder="Descrição da tarefa">
        {{ tarefa.descricao|default:'' }}</textarea
        >
        <!--Data de início-->
        <label for="data_criacao">Data de início</label>
        <input
          type="date"
          name="data_criacao"
          id="data_criacao"
          value="{{ tarefa.data_criacao|default:'' }}"
          required
        />
        <!--Status-->
        <label for="status">Status</label>
        <select name="status" id="status">
          <option value="pendente">Pendente</option>
          <option value="em_andamento">Em andamento</option>
          <option value="concluida">Concluída</option>
        </select>
        <!--Botão-->
        <button type="submit">Salvar</button>
        <button type="button" class="cancel-button" onclick="cancelar()">
          Cancelar
        </button>
      </form>
    </div>

    <script>
      function cancelar() {
        window.location.href = "{% url 'lista_tarefas' %}";
      }
    </script>
  </body>
</html>
